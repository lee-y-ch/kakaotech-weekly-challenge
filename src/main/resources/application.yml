spring:
  application:
    name: community

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      cluster:
        nodes: "${VALKEY_HOST:localhost}:${VALKEY_PORT:6379}"
        max-redirects: 3
      ssl:
        enabled: ${VALKEY_SSL_ENABLED:false}
      connect-timeout: 2s
      timeout: 2s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-seconds: 7200

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/}

aws:
  region: ${AWS_REGION:ap-northeast-2}

  s3:
    original-bucket: ${S3_ORIGINAL_BUCKET}
    processed-bucket: ${S3_PROCESSED_BUCKET}

  image:
    base-url: "${IMAGE_BASE_URL:https://images.leo-community.xyz}"

  presigned-url:
    expiration-seconds: ${PRESIGNED_URL_EXPIRATION_SECONDS:300}
    max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}

view-count:
  buffer:
    enabled: ${VIEW_COUNT_BUFFER_ENABLED:false}
    partitions: 16
    flush-interval-ms: 10000
    lock-ttl: 30s
    total-ttl: 24h
