name: Backend CI/CD

on:
  # PR(→develop, →main): 컴파일 + 단위 테스트로 검증
  # main PR 에서는 추가로 Docker 빌드까지 검증
  pull_request:
    branches: [develop, main]
  # main 에 merge(push)될 때만 실제 배포
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 501479502338.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: community/backend

jobs:
  # 1) 빠른 검사: 컴파일 + 단위 테스트 (Docker 없이 러너에서 직접)
  #    모든 PR(develop/main)에서 실행
  test:
    name: Compile & Unit Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0          # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a          # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - name: Compile & run unit tests
        run: ./gradlew test

  # 2) 중간 검사: Docker 빌드 검증 (배포 직전 확인)
  #    main PR 에서만 실행. 이미지가 정상 빌드되는지 확인
  build-check:
    name: Docker Build Check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0          # v7.0.0
      - name: Build image (verify only)
        run: docker build -t community-backend:ci-check .

  # 3) 배포: main merge 시 ECR push + SSM 배포 + 롤백
  deploy:
    name: Push image & open deploy PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0          # v7.0.0

      - name: Compute image tag
        id: meta
        run: echo "image_tag=git-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
        with:
          role-to-assume: arn:aws:iam::501479502338:role/leo-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64            # v2.1.6

      # 불변 태그라 이미 있는 태그를 재push 하면 실패
      # 존재하면 build/push 를 건너뛰어 re-run/재배포 가능
      - name: Check if image tag exists in ECR
        id: check
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push image
        if: steps.check.outputs.exists == 'false'
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.image_tag }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      # 배포는 ArgoCD 가 한다. 여기서는 새 이미지 태그를 매니페스트 저장소에 올려
      # PR 만 연다. 머지(= 실제 배포 시작)는 사람이 결정한다.
      - name: Open image tag PR on infra repo
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          INFRA_REPO: lee-y-ch/community-infra
          VALUES_PATH: helm/backend/values.yaml
          COMPONENT: backend
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::INFRA_REPO_TOKEN secret is missing, so ${IMAGE_TAG} cannot be promoted."
            exit 1
          fi

          BRANCH="chore/deploy-${COMPONENT}-${IMAGE_TAG#git-}"

          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git" infra
          cd infra

          # image: 블록 안의 tag 한 줄만 바꾼다. 다른 곳의 tag 키는 건드리지 않는다.
          python3 - "${VALUES_PATH}" "${IMAGE_TAG}" <<'PY'
          import pathlib, re, sys

          path, tag = sys.argv[1], sys.argv[2]
          values = pathlib.Path(path)
          lines = values.read_text().splitlines(keepends=True)

          inside = changed = False
          previous = None
          for index, line in enumerate(lines):
              if re.match(r'^image:\s*$', line):
                  inside = True
                  continue
              if inside and re.match(r'^\S', line):
                  inside = False
              if inside and not changed:
                  match = re.match(r'^(\s+tag:\s*)(\S*)\s*$', line)
                  if match:
                      previous = match.group(2)
                      lines[index] = f"{match.group(1)}{tag}\n"
                      changed = True

          if not changed:
              sys.exit(f"no tag line found under image: in {path}")

          values.write_text(''.join(lines))
          print(f"{previous} -> {tag}")
          PY

          if git diff --quiet; then
            echo "::notice::${VALUES_PATH} is already at ${IMAGE_TAG}. Nothing to promote."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${BRANCH}"
          git commit -aqm "chore: deploy ${COMPONENT} ${IMAGE_TAG}"
          git push --quiet --force origin "${BRANCH}"

          OPEN_PR=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${OPEN_PR}" ]; then
            echo "::notice::PR #${OPEN_PR} is already open for ${BRANCH}."
            exit 0
          fi

          gh pr create --base main --head "${BRANCH}" \
            --title "chore: deploy ${COMPONENT} ${IMAGE_TAG}" \
            --body "$(printf '%s\n' \
              "${COMPONENT} 이미지 \`${IMAGE_TAG}\` 를 배포 대상으로 올립니다." \
              "" \
              "- 이미지: 이미 ECR 에 적재되어 있습니다." \
              "- 출처: ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
              "- 이 PR 을 머지하면 ArgoCD 가 감지해 클러스터에 반영합니다." \
              "- 되돌리려면 머지된 커밋을 revert 하면 ArgoCD 가 이전 태그로 돌립니다." \
              "" \
              "자동 생성된 PR 입니다.")"
